name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cài dependencies
        run: flutter pub get

      - name: Sinh mã l10n (ARB -> Dart)
        run: flutter gen-l10n

      - name: Kiểm tra format
        run: dart format --output=none --set-exit-if-changed .

      - name: Phân tích tĩnh
        run: flutter analyze

      - name: Chạy test (gồm cả architecture_test)
        run: flutter test
