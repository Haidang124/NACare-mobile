name: nacare_app
description: "NACare - Ung dung benh nhan cua Benh vien Huu Nghi Da Khoa Nghe An."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.2

  # Networking (real API layer) & secure token storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2

  # UI / design system
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Formatting (dates, currency) & i18n
  intl: ^0.20.2
  flutter_pdfview: ^1.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  generate: true

# Icon app (iOS + Android). Ảnh: assets/images/icon.png (vuông 1024, nền trắng).
# Chạy: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/icon.png"
